name: docker-smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t clojure-stakeholder .
      - name: List values
        run: docker run --rm clojure-stakeholder --list-values
      - name: JSON smoke
        run: docker run --rm clojure-stakeholder --output-format json --focus-family code_analyzer --seed 123
      - name: Experimental provider fail-fast
        run: |
          set +e
          docker run --rm clojure-stakeholder --experimental-provider local-demo
          status=$?
          test "$status" -eq 2
